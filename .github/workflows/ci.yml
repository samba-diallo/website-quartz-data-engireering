name: Build and Validate

# Déclencher sur PR, push sur main, et manuel
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege : ce workflow ne fait que build + upload artifact
permissions:
  contents: read

jobs:
  build:
    name: Build Quartz Site
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code du repository (avec fetch-depth: 0 pour gitleaks)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scan secrets sur tout le diff/historique
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Configurer Node.js avec la version spécifiée
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Installer les dépendances npm
      - name: Install dependencies
        run: npm ci

      # Vérifier les types TypeScript et le linting (fail la CI si erreur)
      - name: Check types and lint
        run: npm run check
      
      # Construire le site Quartz
      - name: Build Quartz site
        run: npm run build
        env:
          NODE_ENV: production
      
      # Vérifier que le dossier public existe et contient des fichiers
      - name: Verify build output
        run: |
          if [ ! -d "public" ]; then
            echo "ERROR: public directory not found"
            exit 1
          fi
          FILE_COUNT=$(find public -type f | wc -l)
          echo "Build generated $FILE_COUNT files"
          if [ $FILE_COUNT -lt 10 ]; then
            echo "ERROR: Build output seems incomplete"
            exit 1
          fi
      
      # Uploader l'artefact de build (optionnel, pour debug)
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartz-build
          path: public/
          retention-days: 5
