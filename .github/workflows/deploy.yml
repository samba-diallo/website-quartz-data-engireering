name: Deploy to Cloudflare Pages

# Déclencher uniquement sur push vers main (production)
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # Récupérer le code du repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Configurer Node.js avec cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      # Installer les dépendances npm si elles ne sont pas en cache
      - name: Install dependencies
        run: npm ci
      
      # Construire le site Quartz
      - name: Build Quartz site
        run: npm run build
        env:
          NODE_ENV: production
      
      # Vérifier que le build a généré du contenu
      - name: Verify build artifacts
        run: |
          echo "Checking build output..."
          ls -la public/ | head -20
          FILE_COUNT=$(find public -type f | wc -l)
          echo "Total files generated: $FILE_COUNT"
          if [ $FILE_COUNT -lt 10 ]; then
            echo "ERROR: Build output incomplete"
            exit 1
          fi
      
      # Déployer sur Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: website-quartz-data-engireering
          directory: public
      
      # Log du succès du déploiement
      - name: Log deployment success
        run: echo "Deployment to Cloudflare Pages completed successfully"
